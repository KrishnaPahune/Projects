<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Distributed Voting System</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .status-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #28a745;
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1rem;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        canvas {
            max-height: 300px;
        }

        .voters-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e1e5e9;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-link a:hover {
            background: rgba(255,255,255,0.3);
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎛️ Admin Dashboard</h1>
            <p><span class="live-indicator"></span>Live Voting System Management</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="status-toggle">
                    <label for="votingToggle">Voting Status:</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="votingToggle" checked>
                        <span class="slider"></span>
                    </div>
                    <span id="statusText">Open</span>
                </div>
                <button id="resetBtn" class="btn btn-danger">🔄 Reset All Votes</button>
                <button id="exportBtn" class="btn btn-primary">📊 Export Results</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalVotes">0</div>
                <div class="stat-label">Total Votes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueVoters">0</div>
                <div class="stat-label">Unique Voters</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="leadingCandidate">-</div>
                <div class="stat-label">Leading Candidate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="participationRate">0%</div>
                <div class="stat-label">Participation Rate</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h3 class="chart-title">📊 Vote Distribution (Bar Chart)</h3>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">🥧 Vote Distribution (Pie Chart)</h3>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <div class="voters-table">
            <h3 class="table-title">👥 Voter Details</h3>
            <table>
                <thead>
                    <tr>
                        <th>Voter ID</th>
                        <th>Name</th>
                        <th>Candidate</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="votersTableBody">
                    <!-- Voter data will be populated here -->
                </tbody>
            </table>
        </div>

        <div class="back-link">
            <a href="/">← Back to Voting</a>
        </div>
    </div>

    <script>
        const socket = io();
        let barChart, pieChart;
        let votingData = {
            candidates: [],
            totalVotes: 0,
            isActive: true,
            voters: []
        };

        // DOM elements
        const votingToggle = document.getElementById('votingToggle');
        const statusText = document.getElementById('statusText');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const totalVotesEl = document.getElementById('totalVotes');
        const uniqueVotersEl = document.getElementById('uniqueVoters');
        const leadingCandidateEl = document.getElementById('leadingCandidate');
        const participationRateEl = document.getElementById('participationRate');
        const votersTableBody = document.getElementById('votersTableBody');

        // Initialize charts
        function initCharts() {
            const barCanvas = document.getElementById('barChart');
            const pieCanvas = document.getElementById('pieChart');

            if (!barCanvas || !pieCanvas) {
                console.error('Chart canvases not found');
                return;
            }

            // Ensure canvases have proper dimensions
            barCanvas.width = barCanvas.offsetWidth;
            barCanvas.height = 300;
            pieCanvas.width = pieCanvas.offsetWidth;
            pieCanvas.height = 300;

            try {
                barChart = new Chart(barCanvas.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Votes',
                            data: [],
                            backgroundColor: [],
                            borderColor: [],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        resizeDelay: 100,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    precision: 0
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `Votes: ${context.parsed.y}`;
                                    }
                                }
                            }
                        },
                        animation: {
                            duration: 750,
                            easing: 'easeInOutQuart'
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating bar chart:', error);
                return;
            }

            try {
                pieChart = new Chart(pieCanvas.getContext('2d'), {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [],
                            borderColor: '#fff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        resizeDelay: 100,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 20,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = ((context.parsed / total) * 100).toFixed(1);
                                        return `${context.label}: ${context.parsed} votes (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        animation: {
                            animateRotate: true,
                            animateScale: false,
                            duration: 750,
                            easing: 'easeInOutQuart'
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating pie chart:', error);
                return;
            }
        }

        // Update charts
        function updateCharts() {
            if (!barChart || !pieChart) {
                console.error('Charts not initialized');
                return;
            }

            const candidates = votingData.candidates || [];
            
            // Update bar chart
            barChart.data.labels = candidates.map(c => c.name || '');
            barChart.data.datasets[0].data = candidates.map(c => c.votes || 0);
            barChart.data.datasets[0].backgroundColor = candidates.map(c => (c.color || '#000') + '80');
            barChart.data.datasets[0].borderColor = candidates.map(c => c.color || '#000');
            barChart.update('active');

            // Update pie chart
            pieChart.data.labels = candidates.map(c => c.name || '');
            pieChart.data.datasets[0].data = candidates.map(c => c.votes || 0);
            pieChart.data.datasets[0].backgroundColor = candidates.map(c => c.color || '#000');
            pieChart.update('active');
        }

        // Update statistics
        function updateStats() {
            totalVotesEl.textContent = votingData.totalVotes;
            uniqueVotersEl.textContent = votingData.voters.length;
            
            // Find leading candidate
            const leadingCandidate = votingData.candidates.reduce((prev, current) => 
                (prev.votes > current.votes) ? prev : current
            );
            
            if (leadingCandidate.votes > 0) {
                leadingCandidateEl.textContent = leadingCandidate.name;
            } else {
                leadingCandidateEl.textContent = '-';
            }
            
            // Calculate participation rate (assuming 100 potential voters)
            const participationRate = Math.round((votingData.voters.length / 100) * 100);
            participationRateEl.textContent = participationRate + '%';
        }

        // Update voters table
        function updateVotersTable() {
            votersTableBody.innerHTML = '';
            
            votingData.voters.forEach(voter => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${voter.id}</td>
                    <td>${voter.name}</td>
                    <td>${voter.candidateName}</td>
                    <td>${new Date(voter.timestamp).toLocaleString()}</td>
                `;
                votersTableBody.appendChild(row);
            });
        }

        // Fetch voters data
        async function fetchVoters() {
            try {
                const response = await fetch('/api/voters');
                const voters = await response.json();
                votingData.voters = voters;
                updateVotersTable();
                updateStats();
            } catch (error) {
                console.error('Error fetching voters:', error);
            }
        }

        // Toggle voting status
        votingToggle.addEventListener('change', () => {
            const isActive = votingToggle.checked;
            statusText.textContent = isActive ? 'Open' : 'Closed';
            socket.emit('toggle-voting', isActive);
        });

        // Reset votes
        resetBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all votes? This action cannot be undone.')) {
                socket.emit('reset-votes');
            }
        });

        // Export results
        exportBtn.addEventListener('click', () => {
            const results = {
                timestamp: new Date().toISOString(),
                totalVotes: votingData.totalVotes,
                candidates: votingData.candidates,
                voters: votingData.voters
            };
            
            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voting-results-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Socket event listeners
        socket.on('voting-data', (data) => {
            votingData = { ...votingData, ...data };
            votingToggle.checked = data.isActive;
            statusText.textContent = data.isActive ? 'Open' : 'Closed';
            updateCharts();
            updateStats();
        });

        socket.on('vote-updated', (data) => {
            votingData = { ...votingData, ...data };
            updateCharts();
            updateStats();
            fetchVoters(); // Refresh voters data
        });

        socket.on('votes-reset', (data) => {
            votingData = { ...votingData, ...data };
            updateCharts();
            updateStats();
            fetchVoters(); // Refresh voters data
        });

        socket.on('voting-status-changed', (data) => {
            votingToggle.checked = data.isActive;
            statusText.textContent = data.isActive ? 'Open' : 'Closed';
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Wait for Chart.js to load and DOM to be ready
            if (typeof Chart === 'undefined') {
                console.error('Chart.js not loaded');
                return;
            }
            
            // Initialize charts immediately after DOM is ready
            initCharts();
            fetchVoters();
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (barChart && pieChart) {
                barChart.resize();
                pieChart.resize();
            }
        });
    </script>
</body>
</html>
